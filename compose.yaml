# ==============================================================================
# HOMELAB AI AGENTS: NOUS RESEARCH HERMES AGENT & MEM0 CONVERSATIONAL MEMORY
# Optimized for ARM64 / Orange Pi 5 Plus (8 Cores RK3588, 32GB RAM)
# ==============================================================================

services:

  # ========================================================
  # INITIALIZATION SERVICE (Automated Host Storage Setup)
  # ========================================================
  init-volumes:
    image: alpine:latest
    container_name: ai_agents_init_volumes
    user: "0:0"
    restart: "no"
    volumes:
      - ${DATA_DIR:-/srv/data/ai-agents}:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Init] Creating storage directories under /data..."
        mkdir -p /data/workspace/hermes/workspace /data/workspace/hermes/output
        mkdir -p /data/mem0/pgdata /data/mem0/history
        mkdir -p /data/neo4j/data /data/neo4j/logs

        echo ">>> [Init] Setting volume ownership and permissions..."
        # 999:999 for PostgreSQL (pgvector)
        chown -R 999:999 /data/mem0/pgdata
        chmod -R 700 /data/mem0/pgdata

        # 7474:7474 for Neo4j
        chown -R 7474:7474 /data/neo4j/data /data/neo4j/logs 2>/dev/null || true
        chmod -R 775 /data/workspace /data/mem0/history /data/neo4j

        echo ">>> [Init] Storage volumes initialized successfully!"

  # ========================================================
  # NOUS RESEARCH HERMES AGENT (Core Agentic Gateway & Engine)
  # ========================================================
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    tty: true
    stdin_open: true
    group_add:
      - "990" # Host docker GID for container spawning
    ports:
      - "${HERMES_GATEWAY_PORT:-8642}:8642"   # Agent Gateway API
      - "${HERMES_DASHBOARD_PORT:-9119}:9119" # Agent Dashboard
      - "${HERMES_BRIDGE_PORT:-3000}:3000"    # Bridge API
    volumes:
      - ${DATA_DIR:-/srv/data/ai-agents}/workspace/hermes:/opt/data
      - ${DATA_DIR:-/srv/data/ai-agents}/workspace/hermes/workspace:/workspace
      - ${DATA_DIR:-/srv/data/ai-agents}/workspace/hermes/output:/output
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY}
      - MEDIA_WORKSPACE_HOST_ROOT=${DATA_DIR:-/srv/data/ai-agents}/workspace/hermes
      - TZ=${TZ:-UTC}
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - PIP_USER=1
      - HERMES_PROFILE=default
      - HERMES_GATEWAY_NO_SUPERVISE=1
      - HERMES_WRITE_SAFE_ROOT=/workspace

      # LiteLLM Proxy / OpenAI-Compatible Backend
      - LITELLM_API_BASE=${LITELLM_API_BASE}
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY}
      - INFINITY_API_KEY=${INFINITY_API_KEY}
      - INFINITY_API_BASE=${INFINITY_API_BASE}

      # Web Search, Docling, Qdrant and Firecrawl
      - WEB_SEARCH_BACKEND=searxng
      - WEB_EXTRACT_BACKEND=firecrawl
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL}
      - SEARXNG_URL=${SEARXNG_BASE_URL}
      - FIRECRAWL_API_URL=${FIRECRAWL_API_URL}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - DOCLING_API_URL=${DOCLING_API_URL}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - VLM_MODEL=${VLM_MODEL:-hermes-vision}

      # Git Integration
      - GITHUB_TOKEN=${GITHUB_TOKEN}

      # Dashboard Settings
      - HERMES_DASHBOARD=true
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}

      # Mem0 Conversational Memory Backend
      - MEMORY_BACKEND=mem0
      - MEM0_API_URL=http://mem0-api:8000
      - MEM0_HOST=http://mem0-api:8000
      - MEM0_BASE_URL=http://mem0-api:8000
      - MEM0_API_KEY=dummy-local-key
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      mem0-api:
        condition: service_started
    networks:
      - shared_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # MEM0 CONVERSATIONAL MEMORY STACK (PGVector + Neo4j + REST API)
  # ========================================================
  mem0-pgvector:
    image: pgvector/pgvector:pg16
    container_name: mem0-pgvector
    restart: unless-stopped
    shm_size: 512mb
    environment:
      - POSTGRES_USER=${MEM0_PG_USER:-postgres}
      - POSTGRES_PASSWORD=${MEM0_PG_PASSWORD:-postgres}
      - POSTGRES_DB=${MEM0_PG_DB:-mem0}
    volumes:
      - ${DATA_DIR:-/srv/data/ai-agents}/mem0/pgdata:/var/lib/postgresql/data
    ports:
      - "${MEM0_PG_PORT:-5432}:5432"
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEM0_PG_USER:-postgres} -d ${MEM0_PG_DB:-mem0}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      shared_net:
        aliases:
          - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  neo4j:
    image: neo4j:5.21.0-community
    container_name: neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-mem0graph_secure_pass}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      # Performance tuning for 32GB RAM node
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
    volumes:
      - ${DATA_DIR:-/srv/data/ai-agents}/neo4j/data:/data
      - ${DATA_DIR:-/srv/data/ai-agents}/neo4j/logs:/logs
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # HTTP Browser Console
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt protocol
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shared_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mem0-api:
    image: mem0/mem0-api-server:latest
    container_name: mem0-api
    restart: unless-stopped
    ports:
      - "${MEM0_API_PORT:-8000}:8000"
    environment:
      - VECTOR_STORE=pgvector
      - MEM0_DIR=/app/.mem0
      - HISTORY_DB_PATH=/app/.mem0/history.db
      - PGVECTOR_DB_URL=postgresql+psycopg2://${MEM0_PG_USER:-postgres}:${MEM0_PG_PASSWORD:-postgres}@mem0-pgvector:5432/${MEM0_PG_DB:-mem0}
      - PGVECTOR_USER=${MEM0_PG_USER:-postgres}
      - PGVECTOR_PASSWORD=${MEM0_PG_PASSWORD:-postgres}
      - PGVECTOR_HOST=mem0-pgvector
      - PGVECTOR_PORT=5432
      - PGVECTOR_DB=${MEM0_PG_DB:-mem0}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-mem0graph_secure_pass}
      - OPENAI_BASE_URL=${LITELLM_API_BASE}
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - LLM_MODEL=${LLM_MODEL:-hermes-default}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
    volumes:
      - ${DATA_DIR:-/srv/data/ai-agents}/mem0/history:/app/.mem0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Mem0] Installing required runtime database drivers..."
        pip install --no-cache-dir psycopg[pool] psycopg2-binary networkx langchain-neo4j rank-bm25

        echo ">>> [Mem0] Starting Uvicorn API server in background..."
        uvicorn main:app --host 0.0.0.0 --port 8000 &

        echo ">>> [Mem0] Waiting for API server to be ready..."
        python3 -c "
        import urllib.request, time
        while True:
            try:
                urllib.request.urlopen('http://127.0.0.1:8000/openapi.json').read()
                break
            except Exception:
                time.sleep(2)
        "

        echo ">>> [Mem0] API is up! Applying dynamic configuration..."
        python3 -c "
        import urllib.request, json, os

        cfg = {
            'version': 'v1.1',
            'vector_store': {
                'provider': 'pgvector',
                'config': {
                    'host': 'mem0-pgvector',
                    'port': 5432,
                    'dbname': os.environ.get('PGVECTOR_DB', 'mem0'),
                    'user': os.environ.get('PGVECTOR_USER', 'postgres'),
                    'password': os.environ.get('PGVECTOR_PASSWORD', 'postgres'),
                    'collection_name': 'memories'
                }
            },
            'graph_store': {
                'provider': 'neo4j',
                'config': {
                    'url': os.environ.get('NEO4J_URI', 'bolt://neo4j:7687'),
                    'username': os.environ.get('NEO4J_USERNAME', 'neo4j'),
                    'password': os.environ.get('NEO4J_PASSWORD', 'mem0graph_secure_pass')
                }
            },
            'llm': {
                'provider': 'openai',
                'config': {
                    'api_key': os.environ.get('OPENAI_API_KEY', ''),
                    'openai_base_url': os.environ.get('OPENAI_BASE_URL', ''),
                    'model': os.environ.get('LLM_MODEL', 'hermes-default')
                }
            },
            'embedder': {
                'provider': 'openai',
                'config': {
                    'api_key': os.environ.get('OPENAI_API_KEY', ''),
                    'openai_base_url': os.environ.get('OPENAI_BASE_URL', ''),
                    'model': os.environ.get('EMBEDDING_MODEL', 'BAAI/bge-m3')
                }
            },
            'history_db_path': '/app/.mem0/history.db'
        }

        try:
            req = urllib.request.Request('http://127.0.0.1:8000/configure', method='POST')
            req.add_header('Content-Type', 'application/json')
            with urllib.request.urlopen(req, data=json.dumps(cfg).encode('utf-8')) as res:
                print('Configuration response:', res.read().decode('utf-8'))
        except Exception as e:
            print('Configuration notice:', e)
        "

        echo ">>> [Mem0] Configuration applied! Waiting on service..."
        wait
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      mem0-pgvector:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - shared_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_net:
    name: ${SHARED_NETWORK:-shared_net}
    external: true
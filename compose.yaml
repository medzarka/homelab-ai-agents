# ==============================================================================
# HOMELAB AI AGENTS STACK
# Services: Hermes Agent (Gateway & Dashboard), Workspace Scanner & Open-WebUI
# Fully integrated with Homelab Microservices (Ollama, TEI, Speaches, Mem0, Qdrant, Sandbox)
# Multi-Arch Ready: linux/amd64 and linux/arm64
# ==============================================================================

services:

  # ========================================================
  # INITIALIZATION SERVICE (Automated Host Storage Setup)
  # ========================================================
  init-volumes:
    image: alpine:latest
    container_name: ai_agents_init_volumes
    user: "0:0"
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/srv/data/ai-agents}:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Init] Initializing Hermes Agent & Open-WebUI storage directories..."
        mkdir -p /data/workspace/hermes/workspace /data/workspace/hermes/output
        mkdir -p /data/open-webui

        echo ">>> [Init] Setting volume ownership and permissions..."
        chmod -R 775 /data/workspace /data/open-webui
        echo ">>> [Init] Storage volumes initialized successfully! Guard active."
        sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -d /data/workspace/hermes/workspace && test -d /data/open-webui || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ========================================================
  # NOUS RESEARCH HERMES AGENT (Core Agentic Gateway & Engine)
  # ========================================================
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    tty: true
    stdin_open: true
    volumes:
      - ${DATA_DIR:-/srv/data/ai-agents}/workspace/hermes:/opt/data
      - ${DATA_DIR:-/srv/data/ai-agents}/workspace/hermes/workspace:/workspace
      - ${DATA_DIR:-/srv/data/ai-agents}/workspace/hermes/output:/output
      - ./config/config.yaml:/opt/data/config.yaml:ro
      - ./scripts:/workspace/scripts:ro
    environment:
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY}
      - MEDIA_WORKSPACE_HOST_ROOT=${DATA_DIR:-/srv/data/ai-agents}/workspace/hermes
      - TZ=${TZ:-UTC}
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - PIP_USER=1
      - HERMES_PROFILE=default
      - HERMES_GATEWAY_NO_SUPERVISE=1
      - HERMES_WRITE_SAFE_ROOT=/workspace

      # LiteLLM Proxy / Model Gateway
      - LITELLM_API_BASE=${LITELLM_API_BASE:-http://litellm:4000/v1}
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY}
      - LLM_MODEL=${LLM_MODEL:-hermes-default}
      - VLM_MODEL=${VLM_MODEL:-hermes-vision}

      # Text Embeddings via TEI
      - EMBEDDINGS_API_BASE=${EMBEDDINGS_API_BASE:-http://embeddings:80/v1}
      - TEI_API_KEY=${TEI_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}

      # Web Search & Extraction Tools
      - WEB_SEARCH_BACKEND=searxng
      - WEB_EXTRACT_BACKEND=firecrawl
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080}
      - SEARXNG_URL=${SEARXNG_BASE_URL:-http://searxng:8080}
      - FIRECRAWL_API_URL=${FIRECRAWL_API_URL:-http://firecrawl-api:3036}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}

      # Conversational Memory Backend (Mem0 on homelab-ai-knowledge)
      - MEMORY_BACKEND=mem0
      - MEM0_API_URL=${MEM0_API_URL:-http://mem0-api:8000}
      - MEM0_HOST=${MEM0_API_URL:-http://mem0-api:8000}
      - MEM0_BASE_URL=${MEM0_API_URL:-http://mem0-api:8000}
      - MEM0_API_KEY=${MEM0_API_KEY:-dummy-local-key}

      # Model Context Protocol (MCP) Integration
      - KNOWLEDGE_MCP_URL=${KNOWLEDGE_MCP_URL:-http://knowledge-mcp:8095/mcp/sse}
      - SANDBOX_MCP_URL=${SANDBOX_MCP_URL:-http://agent-sandbox:8088/sse}
      - SANDBOX_API_KEY=${SANDBOX_API_KEY:-}

      # Speech-To-Text via Speaches (Systran/faster-whisper-large-v3)
      - SPEACHES_BASE_URL=${SPEACHES_BASE_URL:-http://speaches:8000/v1}
      - SPEACHES_API_KEY=${SPEACHES_API_KEY:-}

      # Git Integration
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}

      # Dashboard Settings
      - HERMES_DASHBOARD=true
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      # Basic auth is disabled in favor of Authelia SSO
      # - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      # - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      # - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
    depends_on:
      init-volumes:
        condition: service_healthy
    networks:
      - shared_net
      - homelab_swarm_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hermes.rule=Host(`hermes.${ROOT_DOMAIN:-bluewave.work}`, `agents.${ROOT_DOMAIN:-bluewave.work}`)"
      - "traefik.http.routers.hermes.entrypoints=websecure"
      - "traefik.http.routers.hermes.tls=true"
      - "traefik.http.routers.hermes.middlewares=authelia-sso@file,app-fail2ban@file,security-headers@file"
      - "traefik.http.services.hermes.loadbalancer.server.port=9119"
      - "traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # WORKSPACE KNOWLEDGE SCANNER (Automated Periodic Sync)
  # ========================================================
  workspace-scanner:
    image: python:3.11-alpine
    container_name: hermes_workspace_scanner
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/srv/data/ai-agents}/workspace/hermes/workspace:/workspace
      - ./scripts/sync_workspace.py:/usr/local/bin/sync_workspace.py:ro
    environment:
      - WORKSPACE_DIR=/workspace
      - KNOWLEDGE_MCP_HTTP_URL=${KNOWLEDGE_MCP_HTTP_URL:-http://knowledge-mcp:8095}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-workspace}
      - SCAN_INTERVAL_SECONDS=${SCAN_INTERVAL_SECONDS:-900}
    command:
      - /bin/sh
      - -c
      - |
        echo ">>> [Workspace Scanner] Automated periodic scanner active (Interval: $${SCAN_INTERVAL_SECONDS:-900}s)"
        sleep 20
        while true; do
          python3 /usr/local/bin/sync_workspace.py || true
          echo ">>> [Workspace Scanner] Next scan in $${SCAN_INTERVAL_SECONDS:-900}s..."
          sleep $${SCAN_INTERVAL_SECONDS:-900}
        done
    depends_on:
      init-volumes:
        condition: service_healthy
    networks:
      - shared_net
      - homelab_swarm_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # OPEN-WEBUI CHAT INTERFACE
  # ========================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/srv/data/ai-agents}/open-webui:/app/backend/data
    environment:
      # --- 1. UI Customization ---
      - WEBUI_NAME=${WEBUI_NAME:-Bluewave AI Hub}
      - WEBUI_BRAND=${WEBUI_BRAND:-Bluewave AI Hub}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - BYPASS_MODEL_ACCESS_CONTROL=true
      - WEBUI_WORKERS=${WEBUI_WORKERS:-4}

      # --- 1.1 SSO / Authentication (Authelia ForwardAuth) ---
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=Remote-Email
      - WEBUI_AUTH_TRUSTED_NAME_HEADER=Remote-Name

      # --- 2. LLM Chat Models (LiteLLM Gateway & Ollama fallback) ---
      - OPENAI_API_BASE_URLS=${LITELLM_API_BASE:-http://litellm:4000/v1};${OLLAMA_API_BASE:-http://ollama:11434/v1}
      - OPENAI_API_KEYS=${LITELLM_MASTER_KEY:-};ollama
      - ENABLE_OLLAMA_API=true
      - OLLAMA_BASE_URL=${OLLAMA_API_BASE:-http://ollama:11434}
      
      # --- 3. TEI Embeddings & Reranker Engine ---
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_OPENAI_API_BASE_URL=${EMBEDDINGS_API_BASE:-http://embeddings:80/v1}
      - RAG_OPENAI_API_KEY=${TEI_API_KEY:-}
      - RAG_EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - RAG_RERANKING_ENGINE=tei
      - RAG_RERANKING_TEI_BASE_URL=${RERANKER_API_BASE:-http://reranker:80}
      - RAG_RERANKING_MODEL_NAME=BAAI/bge-reranker-v2-m3

      # --- 4. SearXNG Web Search Integration ---
      - ENABLE_RAG_WEB_SEARCH=True
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_SEARCH_URL=${SEARXNG_BASE_URL:-http://searxng:8080}/search?q=<query>
      - BYPASS_WEB_SEARCH_WEB_LOADER=True

      # --- 5. Speaches Audio STT & TTS Engine ---
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=${SPEACHES_BASE_URL:-http://speaches:8000/v1}
      - AUDIO_STT_OPENAI_API_KEY=${SPEACHES_API_KEY:-}
      - AUDIO_STT_MODEL=Systran/faster-whisper-large-v3
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=${SPEACHES_BASE_URL:-http://speaches:8000/v1}
      - AUDIO_TTS_OPENAI_API_KEY=${SPEACHES_API_KEY:-}
      - AUDIO_TTS_MODEL=speaches-ai/Kokoro-82M-v1.0-ONNX
      - AUDIO_TTS_VOICE=af_heart

      # --- 6. Vector Database Integration via Qdrant ---
      - VECTOR_DB=qdrant
      - QDRANT_URI=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}

      # --- 7. Timeouts ---
      - HTTP_TIMEOUT=1800
      - AIOHTTP_TIMEOUT=1800

    depends_on:
      init-volumes:
        condition: service_healthy
    networks:
      - shared_net
      - homelab_swarm_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`open-webui.${ROOT_DOMAIN:-bluewave.work}`, `chat.${ROOT_DOMAIN:-bluewave.work}`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.routers.open-webui.middlewares=app-fail2ban@file,security-headers@file,compression@file"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
      - "traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_net:
    name: ${SHARED_NETWORK:-shared_net}
    external: true
  homelab_swarm_net:
    name: ${SWARM_NETWORK:-homelab_swarm_net}
    external: true
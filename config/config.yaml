# ==============================================================================
# HERMES AGENT MASTER CONFIGURATION (Production Homelab v3.0)
# Optimized for Academic Teaching (FR), SE&TIC Research (EN), Grants (EN/FR),
# Calibrated Daughters Tutoring (Eya: EN, Mariem: FR, Sarra: FR, Emna: AR),
# and Homelab Microservices (Ollama, TEI, Speaches, Mem0, Qdrant, Sandbox)
# ==============================================================================

model:
  default: hermes-default
  provider: custom
  base_url: ${LITELLM_BASE_URL}
  api_key: ${LITELLM_API_KEY}

providers:
  custom:
    base_url: ${LITELLM_BASE_URL}
    api_key: ${LITELLM_API_KEY}
    models:
      - hermes-default
      - hermes-vision
      - hermes-compression
      - hermes-web-extract
      - hermes-skills-hub
      - hermes-auxiliary
      - hermes-mcp
      - hermes-title
      - hermes-triage-specifier
      - hermes-kanban
      - hermes-profile-describer
      - hermes-curator
      - hermes-approval
      - hermes-ocr-and-documents
  ollama:
    base_url: ${OLLAMA_BASE_URL}
    api_key: ${OLLAMA_API_KEY}
    models:
      - ${OLLAMA_MODEL}
      - ${OLLAMA_VLM_MODEL}

agent:
  max_turns: 500
  verify_on_stop: true
  verbose: false
  reasoning_effort: high
  personalities:
    professor: >
      You are Professor Mohamed Zarka's elite academic co-pilot at ISET Kairouan.
      Deliver all university teaching materials, lecture notes, lab guides, and evaluations in French.
      You excel in Computer Science pedagogy (Algorithms & Programming, Big Data, Machine Learning, Agentic AI).
      You design Bloom-aligned syllabi, crystal-clear French lecture notes, reproducible Docker/Proxmox labs,
      and balanced evaluations. You strictly follow the Continuous Verification Loop (CVL).
      For executing code or generating LaTeX documents, always utilize the agent_sandbox MCP tools.
    researcher: >
      You are a senior research scientist at SE&TIC Lab (University of Carthage).
      Deliver all scientific writing, experiment scripts, analysis, and paper drafts strictly in English.
      You specialize in Robust Speech Recognition, Autism acoustic biomarker detection,
      Ultrasound rock analysis using ML, and AI in Education.
      You produce publication-grade IEEE/Springer manuscripts, mathematically rigorous equations,
      and clean Python/PyTorch code with execution profiling and strict metrics (Accuracy, EER, F1-Score).
      For all experiment validation and code runs, delegate to the agent_sandbox MCP tools.
    reviewer2: >
      You are the notoriously strict 'Reviewer 2' for IEEE Transactions (English).
      You strip away all conversational fluff, aggressively audit experimental methodology,
      detect missing baseline comparisons, identify data leakage, and scrutinize statistical significance.
    grant_writer: >
      You are a senior International Project Funding Specialist (English & French).
      Deliver in English for Erasmus+/Horizon Europe, and in French for DAF/AUF.
      You structure compelling Logical Frameworks (LogFrames), precise Work Packages (WPs),
      Gantt milestones, and measurable socio-economic impact matrices tailored for Tunisian higher education.
    socratic_tutor: >
      You are a warm, patient, and highly engaging pedagogical tutor for Mohamed's four daughters with strict language calibration:
      - Eya (University Year 2): Speak in English (Advanced CS, algorithms, system architecture).
      - Mariem (High School Year 2 - Sciences): Speak in French (Math, Physics/Chemistry, SVT).
      - Sarra (High School Year 1 - Python/Math): Speak in French (Python programming, algebra, geometry).
      - Emna (Basic School Year 2 / 8ème de base): Speak in Modern Standard Arabic (العربية الفصحى) with engaging, simplified analogies.
      CRITICAL: You NEVER provide direct answers or complete code immediately.
      You use Socratic probing questions, relatable Tunisian cultural analogies, and progressive scaffolding.
    productivity_advisor: >
      You are an executive meta-agent and cognitive performance coach communicating with Mohamed in English.
      You analyze Mohamed's workflows, audit time allocation across Teaching, Research, Grants, and Family,
      detect context-switching friction, summarize research monitoring, and provide proactive
      productivity optimization recommendations.

# --- Execution Policy ---
# Code execution is securely delegated to the dedicated Homelab Agent Sandbox MCP Server
terminal:
  backend: disabled
  cwd: /workspace

# --- Web Tools ---
web:
  backend: firecrawl
  search_backend: searxng
  extract_backend: firecrawl
  use_gateway: false

browser:
  inactivity_timeout: 120

tools:
  web_search:
    enabled: true
    provider: searxng
    base_url: ${SEARXNG_BASE_URL}
  firecrawl:
    enabled: true
    api_url: ${FIRECRAWL_API_URL}
    api_key: ${FIRECRAWL_API_KEY}

# --- Hybrid Memory Architecture ---
# 1. Background Automatic Conversational Memory via Mem0 REST API
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 4000
  user_char_limit: 3000
  provider: mem0
  api_url: ${MEM0_API_URL}
  host: ${MEM0_API_URL}
  api_key: ${MEM0_API_KEY}
  nudge_interval: 10
  flush_min_turns: 6

# 2. Explicit Knowledge Retrieval & Sandboxed Code Execution via MCP (SSE)
mcp_servers:
  knowledge:
    url: ${KNOWLEDGE_MCP_URL}?api_key=${KNOWLEDGE_MCP_API_KEY}
    transport: sse
    headers:
      Authorization: "Bearer ${KNOWLEDGE_MCP_API_KEY}"
  agent_sandbox:
    url: ${SANDBOX_MCP_URL}?api_key=${SANDBOX_API_KEY}
    transport: sse
    headers:
      Authorization: "Bearer ${SANDBOX_API_KEY}"

# --- Speech-to-Text (Faster-Whisper via Speaches) ---
stt:
  enabled: true
  provider: openai
  language: ${WHISPER_LANGUAGE}
  echo_transcripts: true
  openai:
    base_url: ${SPEACHES_BASE_URL}
    api_key: "${SPEACHES_API_KEY}"
    model: ${WHISPER_MODEL}

# --- Text-to-Speech (Kokoro-82M via Speaches) ---
tts:
  provider: openai
  speed: 1.0
  openai:
    base_url: ${SPEACHES_BASE_URL}
    api_key: ${SPEACHES_API_KEY}
    model: ${KOKORO_MODEL}
    voice: ${KOKORO_VOICE}

# --- Voice Mode ---
voice:
  auto_tts: true
  record_key: "ctrl+b"

# --- Text Embeddings (BAAI/bge-m3 via TEI) ---
embeddings:
  provider: custom
  model: ${EMBEDDING_MODEL}
  base_url: ${EMBEDDING_API_BASE}
  api_key: ${TEI_API_KEY}

# --- Dashboard & Gateway ---
dashboard:
  enabled: true
  public_url: ${HERMES_DASHBOARD_PUBLIC_URL:-https://hermes.bluewave.work}
  theme: default
  basic_auth:
    username: "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}"
    password: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-admin}"
    password_hash: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH:-scrypt$16384$8$1$jW5ZDh0n6g6lmX3PvrYdLA==$XVsZNrzf5M9Q8q4fVNtN2ZJWRDzzTceQk6yZdcsEfVs=}"
    secret: "${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-homelab-hermes-secret-key-32bytes-secure}"

platforms:
  api_server:
    enabled: true
    port: 8642
    host: 0.0.0.0

platform_toolsets:
  default:
    - file
    - web
    - browser
    - vision
    - memory
    - session_search
    - delegation
    - cronjob
    - skills
    - clarify
    - todo
    - kanban
    - image_gen
